name: AWS EC2 Kubernetes Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-kubernetes-verification:
    name: Verify AWS EC2 K3s Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aws-key.pem
          chmod 600 ~/.ssh/aws-key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Verify EC2 Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/aws-key.pem \
            "$EC2_USER@$EC2_HOST" \
            "echo 'AWS EC2 connection successful'"

      - name: Verify Kubernetes Cluster
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/aws-key.pem \
            "$EC2_USER@$EC2_HOST" \
            "sudo k3s kubectl get nodes"

      - name: Verify Kubernetes Pods
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/aws-key.pem \
            "$EC2_USER@$EC2_HOST" \
            "sudo k3s kubectl get pods -A"

      - name: Verify Kubernetes Services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/aws-key.pem \
            "$EC2_USER@$EC2_HOST" \
            "sudo k3s kubectl get services -A"

      - name: Deployment Verification Complete
        run: echo "AWS EC2 Kubernetes verification completed!"
