name: AWS EC2 Kubernetes Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-kubernetes-verification:
    name: Verify AWS EC2 K3s Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is missing"
            exit 1
          fi

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST secret is missing"
            exit 1
          fi

          if [[ "$EC2_HOST" == *"://"* || "$EC2_HOST" == *"@"* || "$EC2_HOST" == *"/"* ]]; then
            echo "::error::EC2_HOST must contain only the EC2 public IP address or hostname"
            exit 1
          fi

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/aws-key.pem"
          chmod 600 "$HOME/.ssh/aws-key.pem"

          if ! ssh-keygen -y -f "$HOME/.ssh/aws-key.pem" > /dev/null; then
            echo "::error::EC2_SSH_KEY is not a valid private key"
            exit 1
          fi

          touch "$HOME/.ssh/known_hosts"

          if ! ssh-keyscan -T 10 -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"; then
            echo "::error::Cannot reach EC2 on SSH port 22. Check the EC2 public IP, instance status and Security Group inbound rules."
            exit 1
          fi

          echo "SSH configuration completed successfully."

      - name: Verify EC2 Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -e

          if [ -z "$EC2_USER" ]; then
            echo "::error::EC2_USER secret is missing"
            exit 1
          fi

          ssh -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/aws-key.pem" \
            "$EC2_USER@$EC2_HOST" \
            "echo 'AWS EC2 connection successful'"

      - name: Verify Kubernetes Cluster
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/aws-key.pem" \
            "$EC2_USER@$EC2_HOST" \
            "sudo k3s kubectl get nodes"

      - name: Verify Kubernetes Pods
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/aws-key.pem" \
            "$EC2_USER@$EC2_HOST" \
            "sudo k3s kubectl get pods -A"

      - name: Verify Kubernetes Services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/aws-key.pem" \
            "$EC2_USER@$EC2_HOST" \
            "sudo k3s kubectl get services -A"

      - name: Deployment Verification Complete
        run: echo "AWS EC2 Kubernetes verification completed!"
