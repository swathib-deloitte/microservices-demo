
name: AWS Scenario 1 - Terraform Validation

on:
  push:
    branches: [main]
    paths:
      - 'terraform/aws/**'
      - '.github/workflows/aws-terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/aws/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check Terraform directory
        run: |
          pwd
          ls -la
          ls -la terraform/aws/

      - name: Install Terraform
        uses: hashicorp/setup-terraform@uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Format Check
        run: terraform -chdir=terraform/aws fmt -check -recursive

      - name: Terraform Initialize
        run: terraform -chdir=terraform/aws init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/aws validate

