name: AWS Scenario 1 - Deployment

on:
  workflow_run:
    workflows: ["AWS Scenario 1 - Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2 K3s
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aws-ec2-key
          chmod 600 ~/.ssh/aws-ec2-key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Online Boutique to K3s
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/aws-ec2-key \
            "$EC2_USER@$EC2_HOST" \
            'sudo k3s kubectl apply -f -' \
            < release/kubernetes-manifests.yaml

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/aws-ec2-key "$EC2_USER@$EC2_HOST" \
            'sudo k3s kubectl get deployments;
             sudo k3s kubectl get pods;
             sudo k3s kubectl get services'
