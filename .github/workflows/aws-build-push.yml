
name: AWS Docker Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Step 3: Validate Docker Hub Secrets
      - name: Validate Docker Hub Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub secrets are configured"

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-frontend:${{ github.sha }}

      # Step 6: Display Success
      - name: Build Status
        run: |
          echo "Docker image successfully built and pushed!"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-frontend:latest"
